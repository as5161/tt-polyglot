name: verify
# Co-simulation against the golden model, mutation testing and formal proofs.
on: [push, workflow_dispatch]
jobs:
  cosim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Lock-step co-simulation (RTL vs ISS)
        run: python3 test/cosim/run_cosim.py --seeds 100 --cycles 4000 --cov
      - name: Mutation testing (every injected bug must be caught)
        run: python3 test/cosim/mutate.py 30
      - name: 1-Wire master vs a 1-Wire device model
        run: python3 test/proto/test_onewire.py
      - name: SRAM bank model vs the IHP SRAM's own Verilog model (lock-step)
        run: |
          # the two model files from IHP-Open-PDK (Apache-2.0) at a pinned commit
          P=https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/e73adb4045731ddec21634146d536380057f6a26/ihp-sg13g2/libs.ref/sg13g2_sram/verilog
          D=$HOME/pdk/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/verilog
          mkdir -p $D
          curl -fsSL -o $D/RM_IHPSG13_1P_256x32_c2_bm_bist.v $P/RM_IHPSG13_1P_256x32_c2_bm_bist.v
          curl -fsSL -o $D/RM_IHPSG13_1P_core_behavioral_bm_bist.v $P/RM_IHPSG13_1P_core_behavioral_bm_bist.v
          PDK_ROOT=$HOME/pdk test/bank/run.sh
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install yosys / sby / z3 (YoWASP)
        run: |
          pip install yowasp-yosys z3-solver
          mkdir -p $HOME/bin
          for t in yosys yosys-smtbmc yosys-abc; do printf '#!/bin/sh\nexec yowasp-%s "$@"\n' $t > $HOME/bin/$t; chmod +x $HOME/bin/$t; done
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Prove (k-induction)
        run: |
          cd formal
          for m in pg_core pg_fifo pg_host_spi; do yowasp-sby -f $m.sby; done
  asm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Assemble all example programs
        run: |
          cd tools
          for f in ../programs/*.pga; do python3 -m polyglot.asm "$f" > /dev/null; done
          python3 -m polyglot.run ../programs/uart_tx.pga --push 0x41 --cycles 2000
